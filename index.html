<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D1EGX 10</title>
  <meta name="description" content="Página oficial de D1EGX 10: redes sociales y juegos.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Decoración de fondo -->
  <div class="decor" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="coin k1"></div>
    <div class="coin k2"></div>
    <div class="coin k3"></div>
  </div>

  <header class="hero">
    <h1 class="logo" aria-label="D1EGX 10">
      <span>D</span><span>1</span><span>E</span><span>G</span><span>X</span><span class="gap"> </span><span>1</span><span>0</span>
    </h1>
    <p>Pequeña presentación sobre mí, información, etc. (pendiente)</p>
  </header>

  <main class="container">

    <!-- Los 3 recuadros grandes -->
    <section class="big-cards">
      <button class="big-card" data-target="panel-pendiente" aria-expanded="false">
        <span class="big-card__letter">P</span>
        <span class="big-card__label">Pendiente</span>
      </button>

      <button class="big-card" data-target="panel-redes" aria-expanded="false">
        <span class="big-card__letter">R</span>
        <span class="big-card__label">Redes sociales</span>
      </button>

      <button class="big-card" data-target="panel-juegos" aria-expanded="false">
        <span class="big-card__letter">G</span>
        <span class="big-card__label">Mis juegos</span>
      </button>
    </section>

    <!-- Paneles que se despliegan -->
    <section id="panel-pendiente" class="panel" hidden>
      <h2>Pendiente</h2>
      <p class="muted">Aquí irá algo próximamente.</p>
    </section>

    <section id="panel-redes" class="panel" hidden>
      <h2>Redes sociales</h2>
      <div id="lista-redes" class="list"></div>
    </section>

    <section id="panel-juegos" class="panel" hidden>
      <h2>Mis juegos</h2>
      <div id="lista-juegos" class="list"></div>
    </section>

  </main>

  <footer class="footer">
    <p>© <span id="year"></span> D1EGX 10</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
