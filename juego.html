
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego | D1EGX 10</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="theme-juego">
  <main class="page" id="contenido">
    <p class="muted">Cargando...</p>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> D1EGX 10</p>
  </footer>

  <script src="js/data.js"></script>

  <script>
    function esc(t) {
      const d = document.createElement("div");
      d.textContent = t ?? "";
      return d.innerHTML;
    }

    const id = new URLSearchParams(location.search).get("id");
    const j = JUEGOS.find(x => x.id === id);
    const cont = document.getElementById("contenido");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    if (!j) {
      cont.innerHTML = `
        <a class="back" href="index.html#juegos">← Volver</a>
        <h1>Juego no encontrado</h1>
        <p class="muted">
          No se encontró la información del juego solicitado.
        </p>
      `;
    } else {
      document.title = j.nombre + " | D1EGX 10";

      cont.innerHTML = `
        <a class="back" href="index.html#juegos">
          ← Volver a mis juegos
        </a>

        ${j.banner ? `
          <img
            class="game-banner"
            src="${esc(j.banner)}"
            alt="Banner de ${esc(j.nombre)}"
          >
        ` : ""}

        <div class="game-head">
          <img
            src="${esc(j.logo)}"
            alt="Logo de ${esc(j.nombre)}"
          >

          <div>
            <h1>${esc(j.nombre)}</h1>

            <p class="muted">
              ${esc(j.descripcionCorta)}
            </p>

            <div class="btn-row" style="margin-top:.8rem">
              <a
                class="btn"
                href="${esc(j.descarga)}"
                target="_blank"
                rel="noopener"
              >
                Descargar
              </a>

              <a
                class="btn btn--ghost"
                href="gvfprivacidad.html?id=${encodeURIComponent(j.id)}"
              >
                Política de privacidad
              </a>
            </div>
          </div>
        </div>

        <section class="section">
          <h2>Descripción</h2>
          <p>${esc(j.descripcionLarga)}</p>
        </section>

        <section class="section">
          <h2>Capturas</h2>

          <div class="shots">
            ${(j.capturas || []).map(c => `
              <img
                src="${esc(c)}"
                alt="Captura de ${esc(j.nombre)}"
                loading="lazy"
              >
            `).join("")}
          </div>
        </section>

        <section class="section">
          <h2>Versiones</h2>

          ${(j.versiones || []).map(v => `
            <div class="version">
              <strong>v${esc(v.version)}</strong>

              <span class="muted">
                · ${esc(v.fecha)}
              </span>

              <p>${esc(v.cambios)}</p>
            </div>
          `).join("")}
        </section>
      `;
    }
  </script>
</body>
</html>
